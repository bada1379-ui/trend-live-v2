name: Update ETF TREND signals

on:
  schedule:
    - cron: "0 8 * * 1-5"
    - cron: "5 8 * * 5"
    - cron: "0 1 * * 6"

  workflow_dispatch:
    inputs:
      version:
        description: "Signal version"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - first
          - final

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 1 * * 6" ]; then
            echo "value=final" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "5 8 * * 5" ]; then
            echo "value=first" >> "$GITHUB_OUTPUT"
          else
            echo "value=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate signals
        run: python scripts/update_signals.py --version "${{ steps.version.outputs.value }}"

      - name: Commit signals
        shell: bash
        run: |
          if git diff --quiet -- data/signals.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git commit -m "Update ${{ steps.version.outputs.value }} ETF signals"
          git push
